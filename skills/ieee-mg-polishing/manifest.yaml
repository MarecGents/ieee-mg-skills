# ieee-mg-polishing manifest
# 定义轴（axes）和片段（fragments）的映射关系

skill: ieee-mg-polishing
version: 1.0.0

axes:
  - name: paper_type
    description: 论文类型
    values:
      - id: journal
        description: 期刊论文（IEEE Transactions 系列）
        aliases: [trans, journal, ieee trans, transaction]
      - id: conf
        description: 会议论文
        aliases: [conference, conf, proc]
      - id: mag
        description: 杂志论文（IEEE Magazine 系列）
        aliases: [magazine, mag]

  - name: section
    description: 润色章节
    values:
      - id: full
        description: 全文润色
        aliases: [full, whole, entire, all, 全文, 全部]
      - id: abstract
        description: 摘要润色
        aliases: [abstract, summary, 摘要]
      - id: introduction
        description: 引言润色
        aliases: [introduction, intro, background, 引言, 介绍]
      - id: motivation
        description: 动机/相关工作润色
        aliases: [motivation, related work, 动机]
      - id: system-model
        description: 系统模型润色
        aliases: [system model, system model, model, 系统模型]
      - id: numerical-results
        description: 数值结果润色
        aliases: [numerical results, simulation, results, 数值结果, 仿真]
      - id: conclusion
        description: 结论润色
        aliases: [conclusion, summary, 结论]

  - name: language
    description: 文本语言
    values:
      - id: en
        description: 英语
        aliases: [english, en, 英文]
      - id: zh
        description: 中文
        aliases: [chinese, zh, 中文]

  - name: polish_level
    description: 润色深度
    values:
      - id: light
        description: 轻度润色（仅修正语法和拼写）
        aliases: [light, minor, basic, 轻度, 轻微]
      - id: moderate
        description: 中度润色（优化句式和用词）
        aliases: [moderate, normal, standard, 中度, 中等]
      - id: deep
        description: 深度润色（全面优化风格和表达）
        aliases: [deep, heavy, full, major, 深度, 全面]

fragments:
  core: static/core.md
  workflow: static/workflow.md

  sections:
    abstract: static/section-abstract.md
    introduction: static/section-introduction.md
    motivation: static/section-motivation.md
    system-model: static/section-system-model.md
    numerical-results: static/section-numerical-results.md
    conclusion: static/section-conclusion.md

load_rules:
  always: [core, workflow]
  on_section: sections
  on_demand: references/
