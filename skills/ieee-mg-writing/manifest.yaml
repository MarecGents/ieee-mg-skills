# ieee-mg-writing manifest
# 定义轴（axes）和片段（fragments）的映射关系

skill: ieee-mg-writing
version: 1.0.0

axes:
  - name: paper_type
    description: 论文类型
    values:
      - id: journal
        description: 期刊论文（IEEE Transactions 系列）
        aliases: [trans, journal, ieee trans, transaction]
      - id: conf
        description: 会议论文
        aliases: [conference, conf, proc]
      - id: mag
        description: 杂志论文（IEEE Magazine 系列）
        aliases: [magazine, mag]

  - name: section
    description: 论文章节
    values:
      - id: abstract
        description: 摘要
        aliases: [abstract, summary, 摘要]
      - id: introduction
        description: 引言
        aliases: [introduction, intro, background, 引言, 介绍]
      - id: motivation
        description: 动机/相关工作
        aliases: [motivation, related work, motivation and contribution, 动机]
      - id: system-model
        description: 系统模型
        aliases: [system model, system model, model, 系统模型, 模型]
      - id: numerical-results
        description: 数值结果/仿真
        aliases: [numerical results, simulation, results, experiment, 数值结果, 仿真]
      - id: conclusion
        description: 结论
        aliases: [conclusion, summary, 结论, 总结]

  - name: language
    description: 写作语言
    values:
      - id: en
        description: 英语
        aliases: [english, en, 英文]
      - id: zh
        description: 中文
        aliases: [chinese, zh, 中文]

fragments:
  core: static/core.md
  workflow: static/workflow.md

  sections:
    abstract: static/section-abstract.md
    introduction: static/section-introduction.md
    motivation: static/section-motivation.md
    system-model: static/section-system-model.md
    numerical-results: static/section-numerical-results.md
    conclusion: static/section-conclusion.md

load_rules:
  always: [core, workflow]
  on_section: sections
  on_demand: references/
