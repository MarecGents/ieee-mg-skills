# IEEE-MG-Response 技能清单
name: ieee-mg-response
version: 0.1.0
axes:
  response_type:
    values: [editor, reviewer, both]
    default: both
    aliases:
      editor: [回复编辑, editor reply, cover letter]
      reviewer: [回复审稿人, reviewer reply, point-by-point]
      both: [完整回复, full response, 大修回复]
  comment_count:
    values: [integer]
    default: null
    aliases: {}
  language:
    values: [en, zh]
    default: en
    aliases:
      en: [english]
      zh: [中文, 双语]
  paper_type:
    values: [journal, conf, mag]
    default: journal
    aliases:
      journal: [期刊, transactions]
      conf: [会议, conference]
      mag: [杂志, magazine]
  depth:
    values: [full, single-comment]
    default: full
    aliases:
      full: [完整, 整篇, 全部]
      single-comment: [单条, 单个评论, one comment]

# Fragment 映射
fragments:
  always:
    - core.md
    - workflow.md
  by_axis:
    structure:
      trigger: always
      file: section-structure.md
    opening:
      trigger: always
      file: section-opening.md
    latex-format:
      trigger: always
      file: section-latex-format.md
    modification:
      trigger: depth == full && comment_count > 0
      file: section-modification.md
    handling:
      trigger: comment_count > 0
      file: section-handling.md
    editor-response:
      trigger: response_type in [editor, both]
      file: section-editor-response.md
    latex-template:
      trigger: always
      file: section-latex-template.md

# 加载规则
load_rules:
  - 共享层从 ../ieee-mg-share/static/ 按需加载
  - core.md 和 workflow.md 始终加载
  - section 层根据 axes 触发条件按需加载
  - 单条回复模式（single-comment）下仅加载 core.md + section-opening.md + section-handling.md + section-latex-format.md
  - 输入完整性检查优先于所有片段加载
