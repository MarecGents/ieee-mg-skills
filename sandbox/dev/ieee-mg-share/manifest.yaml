# ieee-mg-share manifest
# 共享轴定义 — 被 ieee-mg-writing 和 ieee-mg-polishing 共同引用

skill: ieee-mg-share
version: 1.2.0

axes:
  - name: paper_type
    description: 论文类型（注：static 内容以 journal 为主，conf/mag 为适配分支——conf 篇幅更紧凑、行文更简练，mag 可含教程式说明）
    values:
      - id: journal
        description: 期刊论文（IEEE Transactions 系列；static 语料与模板的主要依据）
        aliases: [trans, journal, ieee trans, transaction]
      - id: conf
        description: 会议论文（适配分支：摘要/引言篇幅压缩，贡献列点更简短）
        aliases: [conference, conf, proc]
      - id: mag
        description: 杂志论文（IEEE Magazine 系列；适配分支：可含教程式/综述式说明）
        aliases: [magazine, mag]

  - name: section
    description: 论文章节
    values:
      - id: abstract
        description: 摘要
        aliases: [abstract, summary, 摘要]
      - id: introduction
        description: 引言
        aliases: [introduction, intro, background, 引言, 介绍]
      - id: motivation
        description: 动机/相关工作
        aliases: [motivation, related work, motivation and contribution, 动机]
      - id: system-model
        description: 系统模型（注意：语料无对应章节数据——All Paper Title.md 仅含 Abstract/Introduction/Numerical Results/Conclusion 四部分，本轴模板基于外部通用知识，非语料蒸馏）
        aliases: [system model, system model, model, 系统模型, 模型]
      - id: numerical-results
        description: 数值结果/仿真
        aliases: [numerical results, simulation, results, experiment, 数值结果, 仿真]
      - id: conclusion
        description: 结论
        aliases: [conclusion, summary, 结论, 总结]

  - name: language
    description: 写作/文本语言（注：static 内容以 en 为主，zh 为适配分支）
    values:
      - id: en
        description: 英语（static 内容的主要语言，语料均为英文）
        aliases: [english, en, 英文]
      - id: zh
        description: 中文（占位轴：暂无中文语料，zh 场景按 en 规则适配翻译）
        aliases: [chinese, zh, 中文]

fragments:
  style-profile: static/style-profile.md
  terminology: static/terminology.md
  expression-bank: static/expression-bank.md
  logic-connectors: static/logic-connectors.md
  section-architecture: static/section-architecture.md
  common-errors: static/common-errors.md
  paragraph-rhythm: static/paragraph-rhythm.md
  quantitative-baseline: static/quantitative-baseline.md

load_rules:
  always: []
  on_demand: static/
